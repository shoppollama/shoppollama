name: Deploy Single Instance

on:
  workflow_dispatch:
  push:
    branches:
      - single-instance

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: shoppollama
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Setup Pulumi
        uses: pulumi/setup-pulumi@v2
        with:
          version: latest

      - name: Configure Pulumi
        run: |
          # Login to Pulumi
          pulumi login s3://shoppollama-pulumi-state
          
          # Select or create stack
          if ! pulumi stack select single; then
            pulumi stack init single
          fi
          
          # Update ECR image configuration
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          pulumi config set ecrImageUri "$IMAGE_URI"
          
          # Deploy single instance
          pulumi up -y --skip-preview

      - name: Export outputs
        run: |
          echo "Instance IP: $(pulumi stack output instancePublicIp)"
          echo "Application URL: $(pulumi stack output applicationUrl)"
