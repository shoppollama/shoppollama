name: Build and Deploy Single Instance

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: shoppollama

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: shoppollama
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Setup Pulumi
        uses: pulumi/setup-pulumi@v2
        with:
          version: latest

      - name: Configure Pulumi
        run: |
          # Login to Pulumi
          pulumi login s3://shoppollama-pulumi-state
          
          # Cancel any existing locks
          pulumi cancel -s prod || true
          
          # Switch to single instance stack
          if ! pulumi stack select single; then
            pulumi stack init single
          fi
          
          # Update ECR image configuration
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          pulumi config set ecrImageUri "$IMAGE_URI"
          
          # Deploy single instance
          pulumi up -y --skip-preview

      - name: Export outputs
        run: |
          echo "Instance IP: $(pulumi stack output instancePublicIp)"
          echo "Application URL: $(pulumi stack output applicationUrl)"
